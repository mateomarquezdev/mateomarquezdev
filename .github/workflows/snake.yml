name: Update profile metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#D97757&color_dots=#1a1a1a,#3d3d3d,#6b6b6b,#a8a8a8,#ededed
            dist/snake-light.svg?color_snake=#D97757&color_dots=#ececec,#c4c4c4,#8f8f8f,#555555,#111111

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Compose the profile canvas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 repo/scripts/compose.py ${{ github.repository_owner }} dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
