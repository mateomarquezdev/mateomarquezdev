<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Knowledge map: Backend, Applied AI, Data, Cloud and DevOps">
  <style>
    text { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .h { fill: #00ff00; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .i { fill: #c8d3c0; font-size: 13px; }
    .card { fill: #11130f; stroke: #33362e; stroke-width: 2; }
    .edge { stroke: #33362e; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .hub { fill: #0c0d0b; stroke: #00ff00; stroke-width: 2; }
    .hubt { fill: #00ff00; font-size: 12px; font-weight: 700; }
    .pulse { fill: none; stroke: #00ff00; stroke-width: 2; transform-origin: 360px 150px; animation: pulse 2.4s ease-out infinite; }
    .g { opacity: 0; animation: in 0.6s ease-out forwards; }
    .dot { fill: #00ff00; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.9); opacity: 0; } }
  </style>

  <rect width="720" height="300" fill="#0c0d0b" rx="10"/>

  <!-- edges -->
  <line class="edge" x1="360" y1="150" x2="190" y2="80"/>
  <line class="edge" x1="360" y1="150" x2="530" y2="80"/>
  <line class="edge" x1="360" y1="150" x2="190" y2="220"/>
  <line class="edge" x1="360" y1="150" x2="530" y2="220"/>

  <!-- hub -->
  <circle class="pulse" cx="360" cy="150" r="30"/>
  <circle class="hub" cx="360" cy="150" r="30"/>
  <text class="hubt" x="360" y="154" text-anchor="middle">&lt;/&gt;</text>

  <!-- Backend -->
  <g class="g" style="animation-delay:.2s">
    <rect class="card" x="20" y="20" width="250" height="118" rx="8"/>
    <text class="h" x="38" y="48">▸ BACKEND</text>
    <text class="i" x="38" y="74"><tspan class="dot">■</tspan> Java · Spring Boot</text>
    <text class="i" x="38" y="96"><tspan class="dot">■</tspan> C# · .NET</text>
    <text class="i" x="38" y="118"><tspan class="dot">■</tspan> REST APIs · Clean layers</text>
  </g>

  <!-- Applied AI -->
  <g class="g" style="animation-delay:.6s">
    <rect class="card" x="450" y="20" width="250" height="118" rx="8"/>
    <text class="h" x="468" y="48">▸ APPLIED AI</text>
    <text class="i" x="468" y="74"><tspan class="dot">■</tspan> Python · LLM APIs</text>
    <text class="i" x="468" y="96"><tspan class="dot">■</tspan> Agents · Tool calling</text>
    <text class="i" x="468" y="118"><tspan class="dot">■</tspan> Automations</text>
  </g>

  <!-- Data -->
  <g class="g" style="animation-delay:1.0s">
    <rect class="card" x="20" y="162" width="250" height="118" rx="8"/>
    <text class="h" x="38" y="190">▸ DATA</text>
    <text class="i" x="38" y="216"><tspan class="dot">■</tspan> MySQL</text>
    <text class="i" x="38" y="238"><tspan class="dot">■</tspan> MongoDB</text>
    <text class="i" x="38" y="260"><tspan class="dot">■</tspan> Redis</text>
  </g>

  <!-- Cloud & DevOps -->
  <g class="g" style="animation-delay:1.4s">
    <rect class="card" x="450" y="162" width="250" height="118" rx="8"/>
    <text class="h" x="468" y="190">▸ CLOUD &amp; DEVOPS</text>
    <text class="i" x="468" y="216"><tspan class="dot">■</tspan> Docker · Linux</text>
    <text class="i" x="468" y="238"><tspan class="dot">■</tspan> Google Cloud</text>
    <text class="i" x="468" y="260"><tspan class="dot">■</tspan> Git · CI/CD</text>
  </g>
</svg>
