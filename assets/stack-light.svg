<svg xmlns="http://www.w3.org/2000/svg" width="640" height="574" viewBox="0 0 640 574" role="img" aria-label="Tech stack: backend, applied AI, data, cloud and ops, frontend"><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.r{opacity:0;animation:in .3s forwards}@keyframes in{to{opacity:1}}.cur{animation:cu 1s steps(1) infinite}@keyframes cu{0%{opacity:1}50%{opacity:0}}</style><rect x="1" y="1" width="638" height="572" rx="10" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/><g class="r" style="animation-delay:0.00s"><text x="22" y="34" font-size="15" font-weight="400" fill="#5E5E5E" xml:space="preserve">$ tree ~/stack</text></g><g class="r" style="animation-delay:0.06s"><text x="22" y="68" font-size="15" font-weight="700" fill="#111111" xml:space="preserve">backend/</text></g><g class="r" style="animation-delay:0.12s"><text x="22" y="92" font-size="15" font-weight="400" fill="#111111" xml:space="preserve">├── java · spring boot</text><text x="300" y="92" font-size="14" fill="#5E5E5E" xml:space="preserve">REST APIs, auth, tests</text></g><g class="r" style="animation-delay:0.18s"><text x="22" y="116" font-size="15" font-weight="400" fill="#111111" xml:space="preserve">├── c# · .net</text><text x="300" y="116" font-size="14" fill="#5E5E5E" xml:space="preserve">APIs, business logic</text></g><g class="r" style="animation-delay:0.24s"><text x="22" y="140" font-size="15" font-weight="400" fill="#111111" xml:space="preserve">└── architecture</text><text x="300" y="140" font-size="14" fill="#5E5E5E" xml:space="preserve">controller → service → repo</text></g><g class="r" style="animation-delay:0.30s"><text x="22" y="174" font-size="15" font-weight="700" fill="#111111" xml:space="preserve">applied-ai/</text></g><g class="r" style="animation-delay:0.36s"><text x="22" y="198" font-size="15" font-weight="400" fill="#111111" xml:space="preserve">├── python</text><text x="300" y="198" font-size="14" fill="#5E5E5E" xml:space="pre