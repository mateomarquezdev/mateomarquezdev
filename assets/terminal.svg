<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Terminal: whoami, focus and current stack">
  <style>
    .bg { fill: #0c0d0b; }
    .bar { fill: #1a1c17; }
    .frame { fill: none; stroke: #33362e; stroke-width: 2; }
    text { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; fill: #c8d3c0; }
    .p { fill: #00ff00; font-weight: 700; }
    .c { fill: #ffffff; }
    .k { fill: #7ee787; }
    .s { fill: #e3b341; }
    .m { fill: #6b7365; }
    .title { fill: #6b7365; font-size: 12px; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .type { animation: type 0.9s steps(28, end) forwards; }
    .cursor { fill: #00ff00; animation: blink 1s steps(1) infinite; opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { from { width: 0; } to { width: 640px; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="t1"><rect class="type" x="40" y="62" height="24" width="0" style="animation-delay:0.4s"/></clipPath>
    <clipPath id="t2"><rect class="type" x="40" y="166" height="24" width="0" style="animation-delay:2.6s"/></clipPath>
    <clipPath id="t3"><rect class="type" x="40" y="268" height="24" width="0" style="animation-delay:5.0s"/></clipPath>
  </defs>

  <rect class="bg" width="720" height="330" rx="10"/>
  <rect class="bar" width="720" height="34" rx="10"/>
  <rect class="bar" y="20" width="720" height="14"/>
  <rect class="frame" x="1" y="1" width="718" height="328" rx="10"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text class="title" x="360" y="22" text-anchor="middle">mateo@buenos-aires: ~</text>

  <!-- 1: whoami -->
  <g clip-path="url(#t1)">
    <text x="40" y="80"><tspan class="p">❯</tspan> <tspan class="c">whoami</tspan></text>
  </g>
  <g class="line" style="animation-delay:1.5s">
    <text x="40" y="106"><tspan class="k">name</tspan><tspan class="s" x="130">"Mateo Marquez"</tspan></text>
    <text x="40" y="128"><tspan class="k">role</tspan><tspan class="s" x="130">"Backend Developer · Applied AI"</tspan></text>
    <text x="40" y="150"><tspan class="k">location</tspan><tspan class="s" x="130">"Buenos Aires, AR"</tspan></text>
  </g>

  <!-- 2: focus -->
  <g clip-path="url(#t2)">
    <text x="40" y="184"><tspan class="p">❯</tspan> <tspan class="c">cat focus.txt</tspan></text>
  </g>
  <g class="line" style="animation-delay:3.7s">
    <text x="40" y="210"><tspan class="m">→</tspan> LLM agents wired into real production tools</text>
    <text x="40" y="232"><tspan class="m">→</tspan> APIs &amp; services with Java/Spring, Python and .NET</text>
    <text x="40" y="254"><tspan class="m">→</tspan> Automations and deploys on Google Cloud</text>
  </g>

  <!-- 3: status -->
  <g clip-path="url(#t3)">
    <text x="40" y="286"><tspan class="p">❯</tspan> <tspan class="c">status --open-to</tspan> <tspan class="k">collabs, backend &amp; AI roles</tspan></text>
  </g>
  <rect class="cursor" x="40" y="300" width="9" height="18" style="animation-delay:6.2s"/>
</svg>
