<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-label="whoami: backend developer and applied AI, Buenos Aires"><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.cur{animation:cu 1s steps(1) infinite}@keyframes cu{0%{opacity:1}50%{opacity:0}}</style><rect x="1" y="1" width="638" height="268" rx="10" fill="#121212" stroke="#2A2A2A" stroke-width="2"/><text x="22" y="34" font-size="15" font-weight="400" fill="#8C8C8C" xml:space="preserve">$ whoami</text><text x="22" y="60" font-size="15" font-weight="700" fill="#EDEDED" xml:space="preserve">backend developer · applied AI</text><text x="22" y="86" font-size="15" font-weight="400" fill="#8C8C8C" xml:space="preserve">buenos aires, ar · open to work</text><text x="22" y="112" font-size="15" font-weight="400" fill="#EDEDED" xml:space="preserve"></text><text x="22" y="124" font-size="15" font-weight="400" fill="#8C8C8C" xml:space="preserve">$ cat about.txt</text><text x="22" y="150" font-size="15" font-weight="400" fill="#EDEDED" xml:space="preserve">I design APIs and services in Java/Spring and .NET,</text><text x="22" y="176" font-size="15" font-weight="400" fill="#EDEDED" xml:space="preserve">and build AI agents in Python that operate real</text><text x="22" y="202" font-size="15" font-weight="400" fill="#EDEDED" xml:space="preserve">production tools: they read data, call APIs and</text><text x="22" y="228" font-size="15" font-weight="400" fill="#EDEDED" xml:space="preserve">automate the repetitive work.<tspan class="cur">▍</tspan></text></svg>